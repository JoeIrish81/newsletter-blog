# Render — web service GRATIS, sempre acceso (scheduler interno + self-ping).
# Dal 23/11/2026: newsletter del venerdì di Giovanni Perilli (render-gp.mjs).
#   venerdì 11:00 Europe/Rome → bozza nel template GHL fisso + prova a Claudio + messaggio Cliq #Newsletter GP
#   Claudio apre /approva e preme «Conferma invio» → etichetta newsletter-gp-invio → workflow GHL invia.
# Il giro automatico parte solo con NEWSLETTER_ATTIVA=1.
services:
  - type: web
    name: newsletter-blog
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: GHL_EMAIL_TOKEN      # Private Integration Token (pit-…): emails/builder, contacts, conversations, custom values
        sync: false               # segreti: da inserire nel dashboard Render
      - key: GHL_USER_ID          # user id GHL (updatedBy)
        sync: false
      - key: ANTHROPIC_API_KEY    # per i testi con Claude (se manca o è al limite: ripiego sugli estratti del blog)
        sync: false
      - key: RUN_TOKEN            # protegge il trigger manuale /prepara?token=...
        sync: false
      - key: CLIQ_ZAPIKEY         # token webhook Cliq «Token 4» (scrive nel canale #Newsletter GP)
        sync: false
      - key: NEWSLETTER_ATTIVA    # 1 = giro del venerdì acceso; altro = spento
        sync: false
      - key: GHL_LOCATION_ID
        value: 65dgBotw4hBLniJ5BTL2
      - key: CLAUDE_MODEL_GP
        value: claude-opus-5-5
